name: Auto Update EPG (极简稳定版)
on:
  schedule:
    - cron: '0 16 * * *'  # 北京时间0点
    - cron: '0 4 * * *'   # 北京时间12点
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  update:
    runs-on: ubuntu-latest  # 建议用 ubuntu-latest 即可，不用写死 24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: 安装依赖（清华源加速）
        run: |
          python3 -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip3 install --upgrade aiohttp tqdm opencc-python-reimplemented lxml requests

      - name: 设置时区 Asia/Shanghai
        run: |
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: 运行EPG生成脚本
        run: |
          echo "=== 开始生成EPG ==="
          rm -rf output/* 2>/dev/null || true
          python3 merge.py
          echo "=== 脚本执行完毕，列出输出目录 ==="
          ls -la output/

      - name: 验证并推送
        run: |
          if [ ! -f "output/epg.xml" ]; then
            echo "❌ 没有生成 epg.xml"
            exit 1
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git commit -m "EPG更新 $(date '+%Y-%m-%d %H:%M:%S')" || echo "✅ 无更新跳过提交"
          git push origin master
